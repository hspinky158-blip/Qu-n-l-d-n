<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nhịp Dự Án</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: thanh điều hướng trái (điện thoại: ngăn kéo), vùng làm việc giữa, ngăn chi tiết công việc trượt từ phải. */
:root{
  --bg:#F2F3F1; --surface:#FFFFFF; --surface-2:#F7F8F6; --sunk:#E9EBE7; --ink:#1A1D1B; --muted:#636A65; --line:#DADDD8;
  --accent:#C2560F; --accent-ink:#FFFFFF; --accent-soft:#FBE9DC;
  --s-todo:#8A918C; --s-doing:#2F6FDB; --s-wait:#B7791F; --s-prod:#7A4FC4; --s-pause:#A0525E; --s-done:#1F8A5B;
  --danger:#C42B1C; --danger-soft:#FBE4E1; --warn:#A66300; --warn-soft:#FCEFD6; --ok:#1F8A5B; --ok-soft:#DDF2E7;
  --shadow:0 1px 2px rgba(20,24,22,.06),0 8px 24px rgba(20,24,22,.08);
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121413; --surface:#1A1D1B; --surface-2:#202421; --sunk:#262A27; --ink:#E6E9E6; --muted:#9AA29D; --line:#30352F;
  --accent:#F08A45; --accent-ink:#1E0F04; --accent-soft:#3A2414;
  --s-todo:#8E9690; --s-doing:#6C9DF0; --s-wait:#E0A84A; --s-prod:#A98BEA; --s-pause:#D58593; --s-done:#4CC08A;
  --danger:#FF7B6E; --danger-soft:#3D1D1A; --warn:#F0B44E; --warn-soft:#3A2E15; --ok:#4CC08A; --ok-soft:#173326;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121413; --surface:#1A1D1B; --surface-2:#202421; --sunk:#262A27; --ink:#E6E9E6; --muted:#9AA29D; --line:#30352F;
  --accent:#F08A45; --accent-ink:#1E0F04; --accent-soft:#3A2414;
  --s-todo:#8E9690; --s-doing:#6C9DF0; --s-wait:#E0A84A; --s-prod:#A98BEA; --s-pause:#D58593; --s-done:#4CC08A;
  --danger:#FF7B6E; --danger-soft:#3D1D1A; --warn:#F0B44E; --warn-soft:#3A2E15; --ok:#4CC08A; --ok-soft:#173326;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{height:100%;display:flex}

/* ---------- Sidebar ---------- */
.side{width:268px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.side-head{padding:16px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}
.side-head b{font-size:15.5px;letter-spacing:-.01em}
.side-head small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.side-scroll{flex:1;overflow:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-weight:500;color:var(--ink);min-width:0}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);color:var(--ink)}
.nav.on .ic{color:var(--accent)}
.nav .ic{width:18px;height:18px;flex:none;color:var(--muted)}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .cnt{font-size:11.5px;font-family:var(--f-mono);color:var(--muted)}
.nav .cnt.bad{color:var(--danger);font-weight:700}
.side-sec{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side-sec button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px;border-radius:6px}
.side-sec button:hover{color:var(--accent);background:var(--surface-2)}
.pnav{flex-direction:column;align-items:stretch;gap:5px}
.pnav .row1{display:flex;align-items:center;gap:8px;min-width:0}
.pdot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--pc,var(--accent))}
.mini{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-left:17px}
.mini i{display:block;height:100%;background:var(--pc,var(--accent))}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:8px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.side-foot .who{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px}
.side-foot .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.topbar{display:none;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.topbar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500}
.view{flex:1;overflow:auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vh h1{margin:0;font-size:22px;letter-spacing:-.015em;text-wrap:balance}
.vh p{margin:2px 0 0;color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.icon{width:34px;height:34px;padding:0;justify-content:center}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:14.5px}
.card-b{padding:14px 16px}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;box-sizing:border-box}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
textarea.inp{width:100%;resize:vertical;min-height:70px;line-height:1.5}
select.inp{padding-right:6px}
.empty-note{padding:26px 16px;text-align:center;color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit}
button.kpi:hover{border-color:var(--muted)}
.kpi .n{font-family:var(--f-mono);font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.2}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi.bad .n{color:var(--danger)} .kpi.warn .n{color:var(--warn)} .kpi.good .n{color:var(--ok)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.plain::before{display:none}
.st-chua-lam{--c:var(--s-todo)} .st-dang-lam{--c:var(--s-doing)} .st-cho-phan-hoi{--c:var(--s-wait)} .st-cho-san-xuat{--c:var(--s-prod)} .st-tam-dung{--c:var(--s-pause)} .st-xong{--c:var(--s-done)}
.pr{font-size:11.5px;font-weight:700;letter-spacing:.02em}
.pr-gap{color:var(--danger)} .pr-cao{color:var(--warn)} .pr-tb{color:var(--muted)} .pr-thap{color:var(--muted);font-weight:500}
.due{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.due.over{color:var(--danger);font-weight:700}
.due.today{color:var(--warn);font-weight:700}
.health{font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px;white-space:nowrap}
.h-ok{background:var(--ok-soft);color:var(--ok)} .h-slow{background:var(--warn-soft);color:var(--warn)} .h-late{background:var(--danger-soft);color:var(--danger)} .h-done{background:var(--sunk);color:var(--muted)}
.bar{height:7px;border-radius:7px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:7px;background:var(--pc,var(--accent))}
.pct{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:36px;text-align:right}

/* avatars */
.av{width:24px;height:24px;border-radius:50%;flex:none;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;background:var(--c,#888);overflow:hidden;vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:30px;height:30px;font-size:12px}
.avs{display:flex}
.avs .av{border:2px solid var(--surface);margin-left:-6px}
.avs .av:first-child{margin-left:0}
.person{display:inline-flex;align-items:center;gap:7px;min-width:0}
.person span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.tt{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.tt .x{overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap}
/* việc con */
.tog{all:unset;box-sizing:border-box;cursor:pointer;width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;flex:none;color:var(--muted);font-size:12px}
.tog:hover{background:var(--sunk);color:var(--ink)}
.tog:focus-visible{outline:2px solid var(--accent)}
.tog-sp{width:20px;flex:none;text-align:center;color:var(--muted);font-weight:400}
tr.sub-row .tt{font-weight:500}
/* kéo thả việc */
.grip{flex:none;width:18px;height:22px;display:inline-grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;user-select:none;border-radius:5px;font-size:14px;opacity:.55;margin-left:-4px}
tr.row:hover .grip,.grip:focus-visible{opacity:1}
.grip:hover{background:var(--sunk);color:var(--ink)}
@media (hover:none){.grip{opacity:.9;width:26px;height:30px;font-size:17px}}
body.tdrag,body.tdrag *{user-select:none!important;cursor:grabbing!important}
.drag-ghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;max-width:280px;padding:7px 11px;border-radius:9px;background:var(--surface);border:1px solid var(--accent);box-shadow:var(--shadow);font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.row.dragging{opacity:.4}
tr.row.drop-in td{background:var(--accent-soft)!important}
tr.row.drop-in td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.row.drop-before td{box-shadow:inset 0 3px 0 var(--accent)}
tr.row.drop-after td{box-shadow:inset 0 -3px 0 var(--accent)}
.drop-top{display:none;position:fixed;z-index:85;left:50%;transform:translateX(-50%);bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 12px));align-items:center;justify-content:center;gap:6px;padding:12px 18px;border:2px dashed var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;max-width:calc(100vw - 32px)}
body.tdrag .drop-top{display:flex}
.drop-top.hot{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.kc.drop-in{outline:2px solid var(--accent);outline-offset:2px;background:var(--accent-soft)}
.tbl-tip{font-size:12px;margin:0;padding:8px 14px;border-top:1px solid var(--line)}
.crumbs{color:var(--muted);font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.kc .crumbs{margin-bottom:-4px}
.dr-path{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);margin-bottom:-12px}
.dr-path button{all:unset;cursor:pointer;color:var(--accent);font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-path button:hover{text-decoration:underline}
.subs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.subs li{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px}
.subs li:hover{background:var(--surface-2)}
.subs .s-t{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;flex-direction:column}
.subs .s-t span{overflow-wrap:anywhere}
.subs .s-t:hover span{color:var(--accent)}
.subs .s-t small{color:var(--muted);font-size:11.5px}
.subs li.done .s-t span{text-decoration:line-through;color:var(--muted)}
.subs .due{font-size:12px;white-space:nowrap}
.tbl select.cell{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 4px;max-width:150px}
.tbl select.cell:hover,.tbl select.cell:focus{border-color:var(--line);background:var(--surface)}
.tbl input.cell{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 4px;font-family:var(--f-mono);font-size:12.5px;width:128px}
.tbl input.cell:hover,.tbl input.cell:focus{border-color:var(--line);background:var(--surface)}
.tbl input.cell.over{color:var(--danger);font-weight:700}
.tbl input.cell.today{color:var(--warn);font-weight:700}
.tbl tr.done .x{text-decoration:line-through;color:var(--muted)}
.grp td{background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

/* project header */
.ph{display:flex;flex-direction:column;gap:12px}
.ph-top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ph-title{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px}
.ph-title input{font-size:22px;font-weight:700;letter-spacing:-.015em;border:1px solid transparent;background:none;border-radius:8px;padding:2px 6px;margin-left:-7px;width:100%;box-sizing:border-box}
.ph-title input:hover{border-color:var(--line)}
.ph-title input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.ph-meta{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.ph-meta label{display:inline-flex;align-items:center;gap:6px}
.ph-meta input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 6px;font-family:var(--f-mono);font-size:12.5px}
.ph-prog{display:flex;align-items:center;gap:10px;width:min(340px,100%);flex:none}
.ph-prog .bar{flex:1;height:9px}
.tabs{display:flex;gap:2px;box-shadow:inset 0 -1px 0 var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .grow{flex:1 1 220px}
.qadd{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:6px 6px 6px 12px}
.qadd input{flex:1;border:0;background:none;outline:none;min-width:0;padding:4px 0}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}

/* kanban */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{width:270px;flex:none;background:var(--sunk);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 290px);min-height:160px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;gap:8px}
.col-h .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.col-b{flex:1;overflow:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:8px;min-height:60px;border-radius:0 0 12px 12px}
.col.over .col-b{background:color-mix(in srgb,var(--accent) 10%,transparent);outline:2px dashed var(--accent);outline-offset:-4px}
.kc{all:unset;box-sizing:border-box;cursor:grab;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:7px;border-left:3px solid var(--c)}
.kc:hover{border-color:var(--muted);border-left-color:var(--c)}
.kc.dragging{opacity:.4}
.kc .t{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.kc .m{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.kc .bar{height:4px}

/* timeline */
.tl{overflow:auto;max-height:calc(100vh - 280px);border:1px solid var(--line);border-radius:12px;background:var(--surface);position:relative}
.tl-grid{display:grid;position:relative}
.tl-name{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;min-width:0;cursor:pointer}
.tl-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-head{position:sticky;top:0;z-index:3;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tl-corner{position:sticky;left:0;top:0;z-index:4;background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 10px;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:flex-end}

}
function dueInfo(t) {

  if (t.status === 'xong') return { cls: '', label: fmt(t.due), state: 'done' };
  const d = dayDiff(today(), t.due);
  if (d < 0 && !NO_ALERT.has(t.status)) return { cls: 'over', label: `${fmt(t.due)} · trễ ${-d} ngày`, state: 'over' };
  if (d === 0) return { cls: 'today', label: 'Hôm nay', state: 'today' };

const DB = {
  db: null, fb: false, local: {}, subs: [], chains: new Map(),
  async init() {
    if (ENV === 'firebase') { this.fb = true; this.db = { firebase: true }; return 'db'; }
    if (ENV === 'claude') { try { this.db = await window.claude.use('db'); } catch (e) { this.db = null; } }
    if (!this.db) this.local = LS.get('pm.local', {});
    return this.db ? 'db' : 'local';
  },
  // trạng thái riêng của từng người (mốc đã đọc thông báo)
  async getMine() {
    try {
      if (this.fb) { const s = await FB.fs.getDoc(FB.fs.doc(FB.db, FB_PREFIX + 'users', ME.id)); return s.exists() ? s.data() : null; }
      if (this.db && ME.id) { const s = await this.db.doc('data/users/' + ME.id + '/state').get(); return s.exists ? s.data() : null; }
    } catch (e) {}
    return null;
  },
  setMine(data) {
    if (!ME.id) return;
    if (this.fb) FB.fs.setDoc(FB.fs.doc(FB.db, FB_PREFIX + 'users', ME.id), data, { merge: true }).catch(() => {});
    else if (this.db) this.db.doc('data/users/' + ME.id + '/state').set(data).catch(() => {});
  },
  watch(coll, cb, opts = {}) {
    if (this.fb) {
      const f = FB.fs, cons = [];
      if (opts.where) cons.push(f.where(...opts.where));
      if (opts.orderBy) cons.push(f.orderBy(...opts.orderBy));
      if (opts.limit) cons.push(f.limit(opts.limit));
      return f.onSnapshot(f.query(f.collection(FB.db, FB_PREFIX + coll), ...cons), s => cb(s.docs.map(d => ({ ...d.data(), id: d.id })), { fromCache: s.metadata.fromCache }), e => (opts.onError || dbError)(e));
    }
    if (this.db) {
      let q = this.db.collection(coll);
      if (opts.where) q = q.where(...opts.where);
      if (opts.orderBy) q = q.orderBy(...opts.orderBy);
      if (opts.limit) q = q.limit(opts.limit);
      return q.onSnapshot(s => cb(s.docs.filter(d => d.exists).map(d => ({ ...d.data(), id: d.id })), s.metadata), e => (opts.onError || dbError)(e));
    }
    const fn = () => {
      let rows = Object.entries(this.local[coll] || {}).map(([id, d]) => ({ ...d, id }));
      if (opts.where) { const [f, , v] = opts.where; rows = rows.filter(r => r[f] === v); }
      if (opts.orderBy) { const [f, dir] = opts.orderBy; rows.sort((a, b) => ((a[f] > b[f]) - (a[f] < b[f])) * (dir === 'desc' ? -1 : 1)); }
      if (opts.limit) rows = rows.slice(0, opts.limit);
      cb(rows, { fromCache: false });
    };
    const sub = { coll, fn }; this.subs.push(sub); setTimeout(fn, 0);
    return () => { this.subs = this.subs.filter(s => s !== sub); };
  },
  _emit(coll) { LS.set('pm.local', this.local); this.subs.filter(s => s.coll === coll).forEach(s => s.fn()); },
  _q(key, fn) {
    const prev = this.chains.get(key) || Promise.resolve();
    const p = prev.catch(() => {}).then(fn);
    this.chains.set(key, p);
    return p.then(() => true, e => { writeError(e, key); return false; });
  },
  _ref(coll, id) { return FB.fs.doc(FB.db, FB_PREFIX + coll, id); },
  set(coll, id, data) {
    return this._q(coll + '/' + id, async () => {
      const d = clean({ ...data, id: undefined });
      if (this.fb) return FB.fs.setDoc(this._ref(coll, id), d);
      if (this.db) return this.db.doc(coll + '/' + id).set(d);
      (this.local[coll] = this.local[coll] || {})[id] = d; this._emit(coll);
    });
  },
  update(coll, id, patch) {
    return this._q(coll + '/' + id, async () => {
      const d = clean(patch);
      if (this.fb) return FB.fs.updateDoc(this._ref(coll, id), d);
      if (this.db) return this.db.doc(coll + '/' + id).update(d);
      const cur = (this.local[coll] || {})[id]; if (!cur) throw { code: 'invalid_argument', message: 'missing' };
      Object.assign(cur, d); this._emit(coll);
    });
  },
  del(coll, id) {
    return this._q(coll + '/' + id, async () => {
      if (this.fb) return FB.fs.deleteDoc(this._ref(coll, id));
      if (this.db) return this.db.doc(coll + '/' + id).delete();
      if (this.local[coll]) delete this.local[coll][id]; this._emit(coll);
    });
  }
};
function writeError(e, key) {
  let c = e && e.code;
  // bảng tài liệu mới: lỗi quyền ở đây chỉ là quy tắc Firestore chưa có pm2_docs, không phải tài khoản bị chỉ xem
  if (key && key.startsWith('docs/') && (c === 'permission-denied' || c === 'invalid_argument')) { toast(ENV === 'firebase' ? 'Chưa lưu được tài liệu: người quản lý cần thêm bảng pm2_docs vào quy tắc Firestore. Vẫn tạo việc được.' : 'Chưa lưu được tài liệu (có thể file quá lớn). Vẫn tạo việc được.'); return; }
  if (c === 'permission-denied') c = 'invalid_argument'; // Firestore: không có quyền ghi
  if (c === 'not-found') { toast('Mục này vừa bị người khác xóa.'); return; }
  if (c === 'resource-exhausted') c = 'quota_exceeded';
  if (c === 'invalid_argument' && ME.canWrite !== false) { ME.canWrite = false; banner(ENV === 'firebase' ? 'Không lưu được: tài khoản của bạn chưa có quyền ghi. Nhờ người quản lý kiểm tra bạn đã có trong trang Thành viên.' : 'Bạn đang ở chế độ chỉ xem nên không lưu được thay đổi. Nhờ chủ dự án mời bạn với quyền Contributor hoặc Editor.'); render(); }
  else if (c === 'quota_exceeded') toast('Kho dữ liệu đã đầy. Hãy xóa bớt dự án cũ đã lưu trữ.');
  else if (c !== 'invalid_argument') toast('Chưa lưu được, kiểm tra mạng rồi thử lại.');
}
function dbError(e) { banner('Mất kết nối dữ liệu (' + ((e && e.code) || 'lỗi') + '). Tải lại trang để kết nối lại.'); }

function hashColor(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PCOLORS[h % PCOLORS.length]; }
function initials(n) { const w = (String(n || '').replace(/\(.*?\)/g, ' ').match(/[\p{L}\p{N}]+/gu) || ['?']); return ((w.length > 1 ? w[w.length - 2][0] : '') + (w[w.length - 1][0] || '?')).toUpperCase(); }

let profTimer = 0;

/* ---------- việc con (nhiều cấp, trường "parent") ---------- */
// chỉ mục cha → con, dựng lại mỗi lần vẽ hoặc khi danh sách việc đổi
let KIDS = null;
function kidsMap() {
  if (KIDS) return KIDS;
  KIDS = new Map();
  for (const t of S.tasks.values()) if (t.parent && t.parent !== t.id && S.tasks.has(t.parent)) { if (!KIDS.has(t.parent)) KIDS.set(t.parent, []); KIDS.get(t.parent).push(t); }
  for (const arr of KIDS.values()) arr.sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));
  return KIDS;
}
const childrenOf = id => kidsMap().get(id) || [];
function descendants(id) { const out = [], seen = new Set([id]); const walk = x => childrenOf(x).forEach(c => { if (seen.has(c.id)) return; seen.add(c.id); out.push(c); walk(c.id); }); walk(id); return out; }
function ancestors(t) { const out = [], seen = new Set([t.id]); let cur = t; while (cur.parent && S.tasks.has(cur.parent) && !seen.has(cur.parent)) { cur = S.tasks.get(cur.parent); seen.add(cur.id); out.unshift(cur); } return out; }
const isTop = t => !t.parent || !S.tasks.has(t.parent);
const parentCrumb = t => { const a = ancestors(t); return a.length ? `<span class="crumbs" title="${esc(a.map(x => x.title).join(' › '))}">↳ ${esc(clip(a[a.length - 1].title, 40))}</span>` : ''; };
const subCount = t => { const k = childrenOf(t.id); return k.length ? `<span title="Việc con xong / tổng">⑂ ${k.filter(c => c.status === 'xong').length}/${k.length} việc con</span>` : ''; };

/* ---------- tính toán ---------- */
// việc có việc con: tiến độ = trung bình tiến độ các việc con (tính dồn nhiều cấp)
function taskProgress(t, depth) {
  if (t.status === 'xong') return 100;
  const kids = (depth || 0) < 15 ? childrenOf(t.id) : [];
  if (kids.length) return Math.round(kids.reduce((s, c) => s + taskProgress(c, (depth || 0) + 1), 0) / kids.length);
  const ck = t.checklist || [];
  if (ck.length) return Math.min(95, Math.round(ck.filter(c => c.done).length / ck.length * 100));
  if (typeof t.progress === 'number') return t.progress;
  const p = ST[t.status] ? ST[t.status].p : 0;
  return p == null ? 0 : p;
}
const tasksOf = pid => [...S.tasks.values()].filter(t => t.pid === pid);
function projStats(p) {
  const ts = tasksOf(p.id);
  const done = ts.filter(t => t.status === 'xong').length;
  const tops = ts.filter(isTop); // việc con đã được tính dồn vào việc cha
  const prog = tops.length ? Math.round(tops.reduce((s, t) => s + taskProgress(t), 0) / tops.length) : 0;
  const over = ts.filter(isOver).length;
  const cost = ts.reduce((s, t) => s + (Number(t.cost) || 0), 0);
  let health = { k: 'h-ok', l: 'Đúng tiến độ' };
  if (ts.length && done === ts.length) health = { k: 'h-done', l: 'Đã xong' };
  else if (p.due && p.due < today()) health = { k: 'h-late', l: 'Trễ hạn dự án' };
  else {
    let expected = null;
    if (p.start && p.due && p.due > p.start) expected = Math.max(0, Math.min(100, dayDiff(p.start, today()) / dayDiff(p.start, p.due) * 100));
    if (over >= 2 || (expected != null && prog < expected - 20)) health = { k: 'h-late', l: 'Có nguy cơ trễ' };
    else if (over === 1 || (expected != null && prog < expected - 8)) health = { k: 'h-slow', l: 'Hơi chậm' };
  }
  if (!ts.length) health = { k: 'h-done', l: 'Chưa có việc' };
  return { ts, total: ts.length, done, prog, over, cost, health };
}
const activeProjects = () => [...S.projects.values()].filter(p => !p.archived).sort((a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0));

const view = $('#view');
let renderQueued = false, deferred = false;
function render() { if (renderQueued) return; renderQueued = true; setTimeout(() => { renderQueued = false; doRender(); }, 0); }
function editing(root) { const a = document.activeElement; return a && root.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox'; }
// vẽ lại nhưng giữ nguyên ô đang gõ (chữ, con trỏ) và vị trí cuộn
function keep(root, scroller, fn) {
  const a = document.activeElement;
  const st = a && root.contains(a) && a.id ? { id: a.id, v: a.value, s: a.selectionStart, e: a.selectionEnd, typing: /^(INPUT|TEXTAREA)$/.test(a.tagName) && !/checkbox|range|date|number/.test(a.type) } : null;
  const sc = scroller();
  const top = sc ? sc.scrollTop : 0;
  fn();
  const sc2 = scroller(); if (sc2) sc2.scrollTop = top;
  if (st) { const n = document.getElementById(st.id); if (n) { if (st.typing) n.value = st.v; n.focus({ preventScroll: true }); if (st.typing) { try { n.setSelectionRange(st.s, st.e); } catch (_) {} } } }
}
function doRender() {
  if (TD && TD.on) return; // đang kéo một việc: vẽ lại sau khi thả

  const pick = $('#pickQ'); if (pick && document.activeElement === pick) { renderView(); renderBell(); wantProfiles(); return; } // đang chọn người: không vẽ lại ngăn chi tiết

  renderBell(); checkReminders();
  wantProfiles();
}

  h += `<div class="side-sec"><span>Dự án</span>${ME.canWrite !== false ? '<button id="addProj" title="Tạo dự án mới" aria-label="Tạo dự án mới">＋</button>' : ''}</div>`;
  const ps = activeProjects();
  if (!ps.length) h += `<div class="muted" style="padding:6px 10px;font-size:13px">${S.loaded.projects ? 'Chưa có dự án nào.' : 'Đang tải…'}</div>`;
  for (const p of ps) {
    const st = projStats(p);
    h += `<button class="nav pnav${S.route === 'p-' + p.id ? ' on' : ''}" data-go="p-${esc(p.id)}" style="--pc:${esc(p.color || PCOLORS[0])}">
      <span class="row1"><span class="pdot"></span><span class="lbl">${esc(p.name)}</span><span class="cnt${st.over ? ' bad' : ''}">${st.over ? st.over + ' trễ' : st.prog + '%'}</span></span>
      <span class="mini"><i style="width:${st.prog}%"></i></span></button>`;
  }
  const arch = [...S.projects.values()].filter(p => p.archived);
  if (arch.length) h += `<div class="side-sec"><span>Đã lưu trữ</span></div>` + arch.map(p => `<button class="nav${S.route === 'p-' + p.id ? ' on' : ''}" data-go="p-${esc(p.id)}">${ICONS.box}<span class="lbl">${esc(p.name)}</span></button>`).join('');
  $('#sideList').innerHTML = h;
  void td;
  const n = S.team.size;
  $('#teamLine').textContent = DB.db && (ENV !== 'firebase' || ME.id) ? (n ? `${n} thành viên · cập nhật trực tiếp` : 'Cập nhật trực tiếp') : (ENV === 'firebase' ? 'Đang đăng nhập…' : 'Bản chạy thử trên máy');
  $('#whoBox').innerHTML = ME.id ? `${avatar(ME.id)}<span>${esc(person(ME.id).name)}${ME.canWrite === false ? ' · chỉ xem' : ''}</span>${ENV === 'firebase' ? '<button class="btn sm ghost" id="signOut" title="Đăng xuất">Đăng xuất</button>' : ''}` : '<span class="muted">Khách</span>';
  const so = $('#signOut'); if (so) so.onclick = signOutFirebase;
}
$('#sideList').addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (b) { go(b.dataset.go); $('#side').classList.remove('open'); return; }
  if (e.target.closest('#addProj')) openProjectForm();
});

function go(r) { if (location.hash.slice(1) !== r) location.hash = r; else { S.route = r; render(); } }
function readRoute() {
  const h = decodeURIComponent(location.hash.slice(1));
  S.route = /^(tong-quan|cua-toi|tai-lieu|thanh-vien|p-[A-Za-z0-9-]+)$/.test(h) ? h : 'tong-quan';
}
window.addEventListener('hashchange', () => { readRoute(); view.scrollTop = 0; render(); });

function renderView() {
  const r = S.route;
  let title = 'Nhịp Dự Án';
  if (!S.loaded.projects || !S.loaded.tasks) { view.innerHTML = `<div class="wrap"><div class="empty-note">Đang tải dữ liệu của team…</div></div>`; return; }
  if (r === 'tong-quan') { view.innerHTML = vOverview(); title = 'Tổng quan'; }
  else if (r === 'cua-toi') { view.innerHTML = vMine(); title = 'Việc của tôi'; }
  else if (r === 'tai-lieu') { view.innerHTML = vResources(); title = 'Tài liệu chung'; }
  else if (r === 'thanh-vien') { view.innerHTML = vMembers(); title = 'Thành viên'; fillMemSearch(); }
  else if (r.startsWith('p-')) {
    const p = S.projects.get(r.slice(2));
    if (!p) { view.innerHTML = `<div class="wrap"><div class="empty-note">Dự án này không còn nữa. <button class="btn sm" data-go="tong-quan">Về tổng quan</button></div></div>`; }
    else { watchDocs(p.id); view.innerHTML = vProject(p); title = p.name; afterProject(p); }
  }
  $('#topTitle').textContent = title;
}

/* ---------- Tổng quan ---------- */
function vOverview() {
  const ps = activeProjects();
  if (!ps.length) return vWelcome();
  const td = today(), wk = addDays(td, 7), since = Date.now() - 7 * 864e5;
  const live = [...S.tasks.values()].filter(t => S.projects.has(t.pid) && !S.projects.get(t.pid).archived);
  const open = live.filter(t => t.status !== 'xong');
  const over = open.filter(isOver);
  const soon = open.filter(t => t.due && t.due >= td && t.due <= wk);
  const doneWeek = live.filter(t => t.status === 'xong' && (t.doneAt || 0) >= since);
  const rows = ps.map(p => {
    const s = projStats(p);
    const mem = [...new Set([...(p.members || []), ...s.ts.map(t => t.assignee).filter(Boolean)])].slice(0, 5);
    return `<tr class="row" data-go="p-${esc(p.id)}" style="--pc:${esc(p.color || PCOLORS[0])}">
      <td><div class="tt"><span class="pdot"></span><span class="x">${esc(p.name)}</span></div><div class="sub"><span>${s.done}/${s.total} việc xong</span>${s.cost ? `<span>${money(s.cost)}</span>` : ''}</div></td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${s.prog}%"></i></div><span class="pct">${s.prog}%</span></div></td>
      <td><span class="health ${s.health.k}">${s.health.l}</span>${s.over ? ` <span class="due over">${s.over} trễ</span>` : ''}</td>
      <td class="due">${p.due ? fmt(p.due) : '<span class="muted">—</span>'}</td>
      <td><div class="avs">${mem.map(m => avatar(m)).join('')}</div></td></tr>`;
  }).join('');
  // khối lượng theo người
  const byWho = new Map();
  for (const t of open) { const k = t.assignee || ''; if (!byWho.has(k)) byWho.set(k, []); byWho.get(k).push(t); }
  const maxN = Math.max(1, ...[...byWho.values()].map(a => a.length));
  const wl = [...byWho.entries()].sort((a, b) => b[1].length - a[1].length).slice(0, 10).map(([k, arr]) => {
    const segs = STATUSES.filter(s => s.k !== 'xong').map(s => { const n = arr.filter(t => t.status === s.k).length; return n ? `<i class="st-${s.k}" style="width:${n / maxN * 100}%" title="${s.l}: ${n}"></i>` : ''; }).join('');
    const o = arr.filter(isOver).length;
    return `<div class="wl-row"><div>${personTag(k || null)}</div><div class="stack">${segs}</div><span class="mono" style="font-size:12.5px">${arr.length}${o ? ` <span class="due over">· ${o} trễ</span>` : ''}</span></div>`;
  }).join('');
  const upcoming = open.filter(t => t.due && t.due <= addDays(td, 14)).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 12);
  return `<div class="wrap">
    <div class="vh"><div><div class="eyebrow">${new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' })}</div><h1>Tổng quan tiến độ</h1></div>
    ${ME.canWrite !== false ? '<button class="btn primary" data-act="new-task">＋ Thêm việc</button>' : ''}</div>
    <div class="kpis">
      <button class="kpi" data-go="cua-toi"><span class="n">${open.length}</span><span class="l">Việc đang mở</span></button>
      <div class="kpi ${over.length ? 'bad' : 'good'}"><span class="n">${over.length}</span><span class="l">Việc trễ hạn</span></div>
      <div class="kpi ${soon.length ? 'warn' : ''}"><span class="n">${soon.length}</span><span class="l">Đến hạn trong 7 ngày</span></div>
      <div class="kpi good"><span class="n">${doneWeek.length}</span><span class="l">Hoàn thành 7 ngày qua</span></div>
    </div>
    <div class="card"><div class="card-h"><h2>Dự án đang chạy</h2><span class="muted" style="font-size:12.5px">Bấm vào dự án để xem chi tiết</span></div>
      <div class="tbl-wrap"><table class="tbl rtbl"><thead><tr><th>Dự án</th><th style="width:28%">Tiến độ</th><th>Tình trạng</th><th>Hạn chót</th><th>Thành viên</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="grid2">
      <div class="card"><div class="card-h"><h2>Sắp đến hạn và trễ hạn</h2><span class="muted" style="font-size:12.5px">14 ngày tới</span></div>
        ${upcoming.length ? `<div class="tbl-wrap"><table class="tbl rtbl" style="min-width:520px"><tbody>${upcoming.map(t => taskRowLite(t, true)).join('')}</tbody></table></div>` : '<div class="empty-note">Không có việc nào đến hạn trong 14 ngày tới.</div>'}</div>
      <div class="card"><div class="card-h"><h2>Khối lượng theo người</h2></div><div class="card-b wl">${wl || '<div class="empty-note">Chưa có việc nào đang mở.</div>'}
        <div class="legend">${STATUSES.filter(s => s.k !== 'xong').map(s => `<span class="st-${s.k}">${s.l}</span>`).join('')}</div></div></div>
    </div>
    ${activityCard(S.activity.slice(0, 12), true)}
  </div>`;
}
function taskRowLite(t, showProj) {
  const di = dueInfo(t), p = S.projects.get(t.pid);
  return `<tr class="row${t.status === 'xong' ? ' done' : ''}" data-task="${esc(t.id)}"><td><div class="tt"><span class="x">${esc(t.title)}</span></div>${showProj && p ? `<div class="sub" style="--pc:${esc(p.color)}"><span class="person"><span class="pdot"></span>${esc(p.name)}</span></div>` : ''}</td>
    <td>${personTag(t.assignee)}</td><td><span class="chip st-${t.status}">${ST[t.status] ? ST[t.status].l : t.status}</span></td><td class="due ${di.cls}">${esc(di.label)}</td></tr>`;
}
function activityCard(list, withProj) {
  return `<div class="card"><div class="card-h"><h2>Hoạt động gần đây</h2></div><div class="card-b">${list.length ? `<ul class="feed">${list.map(a => {
    const p = S.projects.get(a.pid), t = a.tid && S.tasks.get(a.tid);
    return `<li>${avatar(a.actor)}<div class="what"><b>${esc(person(a.actor) ? person(a.actor).name : 'Ai đó')}</b> ${esc(a.text)}${t ? ` · <button data-task="${esc(t.id)}">mở việc</button>` : ''}${withProj && p ? ` <span class="muted">· ${esc(p.name)}</span>` : ''}</div><span class="when">${ago(a.at)}</span></li>`;
  }).join('')}</ul>` : '<div class="empty-note">Chưa có hoạt động nào.</div>'}</div></div>`;
}
function vWelcome() {
  const can = ME.canWrite !== false;
  return `<div class="welcome">
    <div class="eyebrow">Bắt đầu</div><h1>Theo dõi tiến độ dự án cùng cả team</h1>
    <p class="muted" style="margin:0">Mỗi người mở cùng một link, thấy cùng một bảng, và thay đổi của ai cũng hiện ngay cho người khác.</p>
    <ul><li>Bảng việc, Kanban kéo thả và Lịch trình theo ngày</li><li>Cảnh báo việc trễ hạn, tình trạng từng dự án và khối lượng việc của từng người</li><li>Checklist, tài liệu đính kèm, bình luận và lịch sử thay đổi cho từng việc</li></ul>
    ${can ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="new-project">＋ Tạo dự án đầu tiên</button><button class="btn" data-act="sample">Tạo dự án mẫu để xem thử</button></div>` : '<p class="muted">Bạn đang ở chế độ chỉ xem. Khi team tạo dự án, nó sẽ hiện ở đây.</p>'}
  </div>`;
}

/* ---------- Việc của tôi ---------- */
function vMine() {
  if (!ME.id) return `<div class="wrap"><div class="vh"><h1>Việc của tôi</h1></div><div class="card"><div class="empty-note">Trang này cần biết bạn là ai. Hãy đăng nhập claude.ai để thấy những việc được giao cho bạn.</div></div></div>`;
  const td = today(), wk = addDays(td, 7);
  const mine = [...S.tasks.values()].filter(t => t.assignee === ME.id && S.projects.has(t.pid));
  const open = mine.filter(t => t.status !== 'xong');
  const groups = [
    ['Trễ hạn', open.filter(isOver)],
    ['Hôm nay', open.filter(t => t.due === td)],
    ['7 ngày tới', open.filter(t => t.due > td && t.due <= wk)],
    ['Sau đó', open.filter(t => t.due > wk)],
    ['Đang chờ hoặc chưa có hạn', open.filter(t => (!t.due) || (t.due < td && !isOver(t)))]
  ];
  const doneRecent = mine.filter(t => t.status === 'xong').sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 8);
  let body = '';
  for (const [l, arr] of groups) if (arr.length) body += `<tr class="grp"><td colspan="4">${l} · ${arr.length}</td></tr>` + arr.sort((a, b) => (a.due || '9').localeCompare(b.due || '9') || PR[a.prio].rank - PR[b.prio].rank).map(t => mineRow(t)).join('');
  if (doneRecent.length) body += `<tr class="grp"><td colspan="4">Vừa hoàn thành</td></tr>` + doneRecent.map(t => mineRow(t)).join('');
  return `<div class="wrap"><div class="vh"><div><h1>Việc của tôi</h1><p>${open.length} việc đang mở${open.filter(isOver).length ? ` · <b style="color:var(--danger)">${open.filter(isOver).length} trễ hạn</b>` : ''}</p></div></div>
    <div class="card">${body ? `<div class="tbl-wrap"><table class="tbl rtbl" style="min-width:620px"><thead><tr><th>Công việc</th><th>Trạng thái</th><th>Ưu tiên</th><th>Hạn</th></tr></thead><tbody>${body}</tbody></table></div>` : '<div class="empty-note">Bạn chưa được giao việc nào.</div>'}</div></div>`;
}
function mineRow(t) {
  const p = S.projects.get(t.pid), di = dueInfo(t);
  return `<tr class="row${t.status === 'xong' ? ' done' : ''}" data-task="${esc(t.id)}"><td><div class="tt"><span class="x">${esc(t.title)}</span></div><div class="sub" style="--pc:${esc(p.color)}"><span class="person"><span class="pdot"></span>${esc(p.name)}</span>${parentCrumb(t)}${subCount(t)}${checkSub(t)}</div></td>
    <td>${statusSelect(t)}</td><td><span class="pr pr-${t.prio}">${PR[t.prio] ? PR[t.prio].l : ''}</span></td><td class="due ${di.cls}">${esc(di.label)}</td></tr>`;
}
const checkSub = t => (t.checklist && t.checklist.length) ? `<span>☑ ${t.checklist.filter(c => c.done).length}/${t.checklist.length}</span>` : '';
const statusSelect = t => `<select class="cell inp chip st-${t.status}" data-field="status" data-tid="${esc(t.id)}" aria-label="Trạng thái" ${ME.canWrite === false ? 'disabled' : ''}>${STATUSES.map(s => `<option value="${s.k}"${t.status === s.k ? ' selected' : ''}>${s.l}</option>`).join('')}</select>`;

/* ---------- Dự án ---------- */
function filteredTasks(p) {
  const f = S.f, q = f.q.trim().toLowerCase();
  return tasksOf(p.id).filter(t => {
    if (f.hideDone && t.status === 'xong') return false;
    if (f.who === '__none' ? t.assignee : (f.who && t.assignee !== f.who)) return false;
    if (f.prio && t.prio !== f.prio) return false;
    if (f.st && t.status !== f.st) return false;
    if (f.over && !isOver(t)) return false;
    if (q && !(t.title + ' ' + (t.desc || '') + ' ' + ((person(t.assignee) || {}).name || '')).toLowerCase().includes(q)) return false;
    return true;
  });
}
function vProject(p) {
  const s = projStats(p), can = ME.canWrite !== false;
  const mem = [...new Set([...(p.members || []), ...s.ts.map(t => t.assignee).filter(Boolean)])];
  const nDocs = S.docsFor === p.id ? S.docs.size : 0;
  const tabs = [['bang', 'Bảng việc'], ['kanban', 'Kanban'], ['lich', 'Lịch trình'], ['docs', 'Tài liệu' + (nDocs ? ' · ' + nDocs : '')], ['hoat-dong', 'Hoạt động']];
  const team = [...S.team.values()];
  const whoOpts = `<option value="">Mọi người</option><option value="__none"${S.f.who === '__none' ? ' selected' : ''}>Chưa giao</option>` + team.map(m => `<option value="${esc(m.id)}"${S.f.who === m.id ? ' selected' : ''}>${esc(person(m.id).name)}</option>`).join('');
  let body = '';
  const list = filteredTasks(p);
  if (S.tab === 'bang') body = tableView(list, p);
  else if (S.tab === 'kanban') body = kanbanView(list);
  else if (S.tab === 'lich') body = timelineView(list, p);
  else if (S.tab === 'docs') body = docsView(p);
  else body = activityCard(S.activity.filter(a => a.pid === p.id).slice(0, 80), false);
  const tools = (S.tab === 'hoat-dong' || S.tab === 'docs') ? '' : `
    ${can && !p.archived ? `<form class="qadd" id="qadd"><span class="muted">＋</span><input id="qaddInput" placeholder="Thêm việc nhanh rồi nhấn Enter (ví dụ: Thiết kế banner Tết)" maxlength="200" aria-label="Thêm việc nhanh"><button class="btn sm primary" type="submit">Thêm</button></form>` : ''}
    <div class="tools">
      <input class="inp grow" id="fq" type="search" placeholder="Tìm trong dự án…" value="${esc(S.f.q)}" aria-label="Tìm công việc">
      <select class="inp" id="fwho" aria-label="Lọc theo người">${whoOpts}</select>
      <select class="inp" id="fprio" aria-label="Lọc ưu tiên"><option value="">Mọi ưu tiên</option>${PRIOS.map(x => `<option value="${x.k}"${S.f.prio === x.k ? ' selected' : ''}>${x.l}</option>`).join('')}</select>
      ${S.tab !== 'kanban' ? `<select class="inp" id="fst" aria-label="Lọc trạng thái"><option value="">Mọi trạng thái</option>${STATUSES.map(x => `<option value="${x.k}"${S.f.st === x.k ? ' selected' : ''}>${x.l}</option>`).join('')}</select>` : ''}
      <label class="toggle"><input type="checkbox" id="fover"${S.f.over ? ' checked' : ''}> Chỉ việc trễ</label>
      <label class="toggle"><input type="checkbox" id="fdone"${S.f.hideDone ? ' checked' : ''}> Ẩn việc đã xong</label>
      ${S.tab === 'lich' ? `<select class="inp" id="tlScale" aria-label="Độ rộng lịch"><option value="34"${S.tlScale == 34 ? ' selected' : ''}>Xem theo ngày</option><option value="26"${S.tlScale == 26 ? ' selected' : ''}>Vừa</option><option value="12"${S.tlScale == 12 ? ' selected' : ''}>Xem theo tuần</option></select>` : ''}
    </div>`;
  return `<div class="wrap" style="max-width:1320px">
    <div class="ph" style="--pc:${esc(p.color || PCOLORS[0])}">
      <div class="ph-top">
        <div class="ph-title"><div class="eyebrow">${p.archived ? 'Dự án đã lưu trữ' : 'Dự án'}</div>
          <input id="pName" value="${esc(p.name)}" maxlength="120" aria-label="Tên dự án" ${can ? '' : 'readonly'}>
          <div class="ph-meta">
            <label>Bắt đầu <input type="date" id="pStart" value="${esc(p.start || '')}" ${can ? '' : 'disabled'}></label>
            <label>Hạn chót <input type="date" id="pDue" value="${esc(p.due || '')}" ${can ? '' : 'disabled'}></label>
            <span class="health ${s.health.k}">${s.health.l}</span>
            ${s.cost ? `<span>Chi phí: <b class="mono">${money(s.cost)}</b></span>` : ''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end">
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
            ${can && !p.archived ? `<button class="btn sm" data-act="doc-tab">＋ Chia việc từ file</button>` : ''}
            <button class="btn sm" data-act="report">Sao chép báo cáo</button>
            ${can ? `<button class="btn sm" data-act="edit-project">Cài đặt dự án</button>` : ''}
          </div>
          <div class="ph-prog"><div class="bar"><i style="width:${s.prog}%"></i></div><span class="mono" style="font-weight:600">${s.prog}%</span><span class="muted" style="font-size:12.5px">${s.done}/${s.total} xong</span></div>
          <div style="display:flex;align-items:center;gap:8px"><div class="avs" title="Thành viên">${mem.slice(0, 8).map(m => avatar(m, true)).join('')}</div>${can ? '<button class="btn sm" data-act="proj-members">＋ Thành viên</button>' : ''}</div>
        </div>
      </div>
      ${p.desc ? `<p class="muted" style="margin:0;white-space:pre-wrap">${esc(p.desc)}</p>` : ''}
    </div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" data-tab="${k}" class="${S.tab === k ? 'on' : ''}" aria-selected="${S.tab === k}">${l}</button>`).join('')}</div>
    ${tools}
    ${body}
  </div>`;
}
function tableView(list, p) {
  if (!list.length) return `<div class="card"><div class="empty-note">${tasksOf(p.id).length ? 'Không có việc nào khớp bộ lọc.' : 'Dự án chưa có việc nào. Gõ tên việc vào ô “Thêm việc nhanh” ở trên.'}</div></div>`;
  const cmp = (a, b) => (a.status === 'xong') - (b.status === 'xong') || (a.due || '9999').localeCompare(b.due || '9999') || PR[a.prio].rank - PR[b.prio].rank;
  const sorted = treeOrder(list, cmp);
  const can = ME.canWrite !== false;

// sắp việc theo cây: việc cha rồi đến các việc con (thụt vào). Việc con có việc cha bị lọc mất

function treeOrder(list, cmp) {
  const inList = new Set(list.map(t => t.id)), out = [], seen = new Set();
  const walk = (t, lvl, cut) => {
    if (seen.has(t.id)) return; seen.add(t.id);
    const kids = childrenOf(t.id).filter(k => inList.has(k.id)).sort(cmp);
    out.push({ t, lvl, kids: kids.length, cut });
    if (!S.collapsed.has(t.id)) kids.forEach(k => walk(k, lvl + 1, false));
  };
  list.filter(t => !t.parent || !inList.has(t.parent)).sort(cmp).forEach(t => walk(t, 0, !isTop(t)));
  return out;
}

function timelineView(list, p) {
  const td = today();
  const dated = list.filter(t => t.start || t.due);
  if (!dated.length) return `<div class="card"><div class="empty-note">Chưa có việc nào có ngày bắt đầu hoặc hạn. Đặt ngày cho việc để thấy lịch trình.</div></div>`;
  let lo = p.start || td, hi = p.due || td;
  for (const t of dated) { const a = t.start || t.due, b = t.due || t.start; if (a < lo) lo = a; if (b > hi) hi = b; }
  lo = addDays(lo < td ? lo : td, -2); hi = addDays(hi > td ? hi : td, 3);
  const days = dayDiff(lo, hi) + 1, W = S.tlScale, NAME = 230, ROW = 36;
  const cols = `${NAME}px repeat(${days}, ${W}px)`;
  let mon = '', day = '';
  let cur = lo, runStart = 0, runLabel = '';
  for (let i = 0; i < days; i++) {
    const d = new Date(cur + 'T00:00:00'), lab = `Tháng ${d.getMonth() + 1}/${d.getFullYear()}`;
    if (lab !== runLabel) { if (runLabel) mon += `<div class="tl-mon" style="grid-column:${runStart + 2} / ${i + 2}">${runLabel}</div>`; runLabel = lab; runStart = i; }
    const we = d.getDay() === 0 || d.getDay() === 6;
    day += `<div class="tl-day${we ? ' we' : ''}${cur === td ? ' td' : ''}" style="grid-column:${i + 2}">${W >= 20 || d.getDay() === 1 ? d.getDate() : ''}</div>`;
    cur = addDays(cur, 1);
  }
  mon += `<div class="tl-mon" style="grid-column:${runStart + 2} / ${days + 2}">${runLabel}</div>`;
  const order = treeOrder(dated, (a, b) => (a.start || a.due).localeCompare(b.start || b.due));
  const sorted = order.map(x => x.t);
  const rows = order.map(({ t, lvl, kids }, i) => {
    const a = t.start || t.due, b = (t.due && t.due >= a) ? t.due : a;
    const x = dayDiff(lo, a) * W, w = (dayDiff(a, b) + 1) * W - 4, pr = taskProgress(t);
    return `<div class="tl-name" style="grid-row:${i + 3};height:${ROW}px;padding-left:${8 + lvl * 16}px" data-task="${esc(t.id)}">${kids ? `<button class="tog" data-tog="${esc(t.id)}" aria-label="${S.collapsed.has(t.id) ? 'Mở' : 'Thu gọn'} việc con">${S.collapsed.has(t.id) ? '▸' : '▾'}</button>` : ''}${avatar(t.assignee)}<span>${esc(t.title)}</span></div>
      <div class="tl-row" style="grid-row:${i + 3};grid-column:2 / ${days + 2};height:${ROW}px"><div class="tl-bar st-${t.status}${isOver(t) ? ' late' : ''}" style="left:${x + 2}px;width:${Math.max(W - 4, w)}px" data-task="${esc(t.id)}" title="${esc(t.title)} · ${fmt(a)} → ${fmt(b)} · ${pr}%"><i style="width:${pr}%"></i></div></div>`;
  }).join('');
  const tx = dayDiff(lo, td) * W + W / 2;
  return `<div class="tl" id="tl"><div class="tl-grid" style="grid-template-columns:${cols};grid-template-rows:24px 22px repeat(${sorted.length}, ${ROW}px)">
    <div class="tl-corner" style="grid-row:1 / 3;grid-column:1">Công việc</div>
    <div class="tl-head" style="grid-row:1;grid-column:2 / ${days + 2};display:grid;grid-template-columns:repeat(${days}, ${W}px)">${mon.replace(/grid-column:(\d+) \/ (\d+)/g, (m, s, e) => `grid-column:${s - 1} / ${e - 1}`)}</div>
    <div class="tl-head" style="grid-row:2;grid-column:2 / ${days + 2};display:grid;grid-template-columns:repeat(${days}, ${W}px);top:24px">${day.replace(/grid-column:(\d+)/g, (m, s) => `grid-column:${s - 1}`)}</div>
    ${rows}
    <div class="tl-today" style="left:${NAME + tx}px"></div>
  </div></div>`;
}

async function fillPicker(q) {

  let found = [];
  if (USER && q.trim()) { try { found = (await USER.search(q.trim())).map(h => { PROF[h.id] = h; return h.id; }); } catch (e) {} }
  else if (USER && !q.trim()) { try { (await USER.search('')).forEach(h => { PROF[h.id] = h; if (!local.includes(h.id)) found.push(h.id); }); } catch (e) {} }

  h += ids.map(id => `<button data-pick="${esc(id)}">${avatar(id)}<span>${esc(person(id).name)}${id === ME.id ? ' (bạn)' : ''}${person(id).guest ? ' <span class="muted">· ngoài hệ thống</span>' : ''}</span></button>`).join('');
  if (q.trim() && !ids.some(id => person(id).name.toLowerCase() === ql)) h += `<button data-pick="" data-guest="${esc(q.trim())}">＋<span>Thêm “${esc(q.trim())}” (người chưa dùng claude.ai)</span></button>`;
  if (!USER) h += `<div class="hint">${ENV === 'firebase' ? 'Muốn thêm người dùng app, mời Gmail của họ ở trang Thành viên.' : 'Ngoài claude.ai chỉ thêm được tên thủ công.'}</div>`;
  box.innerHTML = h;
}

let TD = null;
view.addEventListener('pointerdown', e => {

function tdMarks() { document.querySelectorAll('.drop-in,.drop-before,.drop-after,.drop-top.hot').forEach(x => x.classList.remove('drop-in', 'drop-before', 'drop-after', 'hot')); }
document.addEventListener('pointermove', e => {
  if (!TD) return;
  if (!TD.on) {
    if (Math.hypot(e.clientX - TD.x, e.clientY - TD.y) < 6) return;
    const t = S.tasks.get(TD.id); if (!t) { TD = null; return; }
    TD.on = true; document.body.classList.add('tdrag');
    TD.ghost = document.createElement('div'); TD.ghost.className = 'drag-ghost'; TD.ghost.textContent = t.title; document.body.appendChild(TD.ghost);
    const row = view.querySelector(`tr.row[data-task="${CSS.escape(TD.id)}"]`); if (row) row.classList.add('dragging');
    TD.timer = setInterval(() => { if (TD && TD.vy) view.scrollTop += TD.vy * 14; }, 30);
  }
  e.preventDefault();
  TD.ghost.style.transform = `translate(${e.clientX + 14}px, ${e.clientY + 10}px)`;
  tdMarks(); TD.target = null; TD.zone = '';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const top = el && el.closest('#dropTop'), row = el && el.closest('tr.row[data-task]');
  if (top) { TD.zone = 'top'; top.classList.add('hot'); }
  else if (row && row.dataset.task !== TD.id && !descendants(TD.id).some(x => x.id === row.dataset.task)) {
    const r = row.getBoundingClientRect(), f = (e.clientY - r.top) / r.height;
    TD.target = row.dataset.task; TD.zone = f < 0.25 ? 'before' : f > 0.75 ? 'after' : 'in';
    row.classList.add('drop-' + TD.zone);
  }
  const vr = view.getBoundingClientRect();
  TD.vy = e.clientY < vr.top + 50 ? -1 : e.clientY > Math.min(vr.bottom, innerHeight) - 50 ? 1 : 0;
}, { passive: false });
async function endTD(cancel) {
  const d = TD; TD = null; if (!d) return;
  if (d.on) {
    clearInterval(d.timer); tdMarks(); d.ghost.remove(); document.body.classList.remove('tdrag');
    view.querySelectorAll('tr.dragging').forEach(x => x.classList.remove('dragging'));
    if (!cancel) {
      if (d.zone === 'top') await moveTask(d.id, null);
      else if (d.target) { const tg = S.tasks.get(d.target); if (tg) await moveTask(d.id, d.zone === 'in' ? tg.id : (tg.parent && S.tasks.has(tg.parent) ? tg.parent : null)); }
    }
  }
  render();
}

async function undoAssign(plan, res) {
  if (!guard()) return;
  const ids = res.ids.filter(Boolean);
  for (const id of ids) S.tasks.delete(id);
  render();
  await Promise.all(ids.map(id => DB.del('tasks', id)));
  // người mới thêm từ file: bỏ khỏi team nếu không còn việc nào của họ
  for (const g of res.guests) if (![...S.tasks.values()].some(t => t.assignee === g)) { S.team.delete(g); await DB.del('team', g); }
  if (res.prev) await DB.update('projects', plan.pid, res.prev);
  const d = plan.doc.id && S.docs.get(plan.doc.id);
  if (d) DB.update('docs', d.id, { made: Math.max(0, (d.made || 0) - ids.length) });
  log(plan.pid, `hoàn tác ${ids.length} việc chia theo tài liệu “${clip(plan.doc.name, 60)}”`, null, 'edit');
  toast(`Đã hoàn tác ${ids.length} việc.`);
}

Chỉ trả lời bằng JSON đúng dạng:

<<<
${String(doc.text || '').slice(0, 60000)}

  else if (state === 'login') authBox.innerHTML = card('Nhịp Dự Án', `<p class="muted">Đăng nhập bằng tài khoản Gmail mà người quản lý đã thêm vào team để xem và cập nhật tiến độ.</p>${extra ? `<p class="auth-err">${esc(extra)}</p>` : ''}`, '<button class="btn primary auth-btn" id="gLogin"><svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#fff" d="M17.6 9.2c0-.6-.1-1.2-.2-1.7H9v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="#fff" d="M9 18c2.4 0 4.5-.8 5.9-2.2L12 13.5c-.8.5-1.8.9-3 .9-2.3 0-4.3-1.6-5-3.7H1v2.3A9 9 0 0 0 9 18z" opacity=".85"/><path fill="#fff" d="M4 10.7a5.4 5.4 0 0 1 0-3.4V5H1a9 9 0 0 0 0 8z" opacity=".7"/><path fill="#fff" d="M9 3.6c1.3 0 2.5.5 3.4 1.3L15 2.4A9 9 0 0 0 1 5l3 2.3c.7-2.1 2.7-3.7 5-3.7z" opacity=".9"/></svg>Đăng nhập bằng Google</button>');
  else if (state === 'denied') authBox.innerHTML = card('Bạn chưa có trong team', `<p class="muted">Tài khoản <b>${esc(extra)}</b> chưa được thêm vào team. Nhờ người quản lý vào trang <b>Thành viên</b> → “Mời bằng Gmail” để thêm địa chỉ này, rồi tải lại trang.</p>`, '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" id="gReload">Tải lại</button><button class="btn" id="gLogout">Dùng tài khoản khác</button></div>');
  else authBox.innerHTML = card('Không kết nối được', `<p class="muted">${esc(extra || 'Kiểm tra mạng rồi tải lại trang.')}</p>`, '<button class="btn" id="gReload">Tải lại</button>');
}
authBox.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'gReload') location.reload();
  if (b.id === 'gCopy') { try { await navigator.clipboard.writeText(location.href); b.textContent = 'Đã sao chép, dán vào Chrome hoặc Safari'; } catch (err) { b.textContent = 'Hãy giữ ngón tay lên link ở trên để sao chép'; } return; }
  if (b.id === 'gLogout') { await FB.au.signOut(FB.auth); }
  if (b.id === 'gLogin') {
    b.disabled = true;
    const provider = new FB.au.GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
    try { await FB.au.signInWithPopup(FB.auth, provider); }
    catch (err) {
      const c = err && err.code;
      // không tự chuyển sang kiểu chuyển trang: trên điện thoại cách đó hay để lại màn hình trắng
      if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') showAuth('blocked');
      else if (c !== 'auth/popup-closed-by-user' && c !== 'auth/cancelled-popup-request') showAuth('login', authMsg(err));
      else b.disabled = false;
    }
  }
  if (b.id === 'gRedirect') {
    b.disabled = true;
    const provider = new FB.au.GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
    try { await FB.au.signInWithRedirect(FB.auth, provider); } catch (err) { showAuth('login', authMsg(err)); }
  }
});
async function bootFirebase() {
  showAuth('loading');
  try {
    const [app, fs, au] = await Promise.all([import(FB_SDK + 'firebase-app.js'), import(FB_SDK + 'firebase-firestore.js'), import(FB_SDK + 'firebase-auth.js')]);
    const fapp = app.initializeApp(FIREBASE_CONFIG);
    FB.fs = fs; FB.au = au; FB.auth = au.getAuth(fapp);
    // dùng bộ nhớ đệm mặc định (trong RAM): bộ nhớ đệm lưu trên máy hay bị treo trên iPhone
    FB.db = fs.initializeFirestore(fapp, {}, FIRESTORE_DB_ID);
  } catch (e) { showAuth('error', 'Không tải được Firebase. Kiểm tra mạng rồi tải lại trang.'); return; }
  let started = false;
  // quay về sau khi đăng nhập kiểu chuyển trang (dùng khi điện thoại chặn cửa sổ bật lên)
  FB.au.getRedirectResult(FB.auth).catch(e => { if (!started) showAuth('login', authMsg(e)); });
  FB.au.onAuthStateChanged(FB.auth, async u => {
    if (!u) { if (started) { location.reload(); return; } showAuth('login'); return; }
    if (started) return;
    const email = String(u.email || '').toLowerCase();
    ME.id = email; ME.name = u.displayName || email.split('@')[0];
    PROF[email] = { id: email, name: ME.name, avatarUrl: u.photoURL || null, color: hashColor(email) };
    // phải có tên trong danh sách team (quy tắc Firestore kiểm tra điều này)
    const ref = FB.fs.doc(FB.db, FB_PREFIX + 'team', email);
    const prof = { name: ME.name, photo: u.photoURL || null, email, lastLogin: Date.now() };
    showAuth('checking', email);
    const timeout = new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 15000));
    try {
      await Promise.race([(async () => {
        const s = await FB.fs.getDoc(ref);
        if (s.exists()) await FB.fs.updateDoc(ref, prof);
        else await FB.fs.setDoc(ref, { kind: 'user', addedAt: Date.now(), ...prof }); // chỉ người quản lý tạo được (theo quy tắc)
      })(), timeout]);
    } catch (e) {
      if (e && e.code === 'permission-denied') showAuth('denied', email);
      else if (e && e.code === 'timeout') showAuth('error', 'Đã đăng nhập ' + email + ' nhưng chưa kết nối được dữ liệu sau 15 giây. Kiểm tra mạng rồi bấm Tải lại. Nếu vẫn vậy, hãy chụp màn hình gửi người quản lý.');
      else showAuth('error', 'Không kết nối được cơ sở dữ liệu (mã lỗi: ' + ((e && e.code) || 'không rõ') + ').');
      return;
    }
    started = true; authBox.hidden = true; authBox.innerHTML = '';
    startData();
  });
}
async function signOutFirebase() { if (FB.au) await FB.au.signOut(FB.auth); }

async function boot() {
  readRoute(); render();
  const mode = await DB.init();
  if (ENV === 'firebase') { bootFirebase(); return; }
  if (ENV === 'claude') { try { USER = await window.claude.use('user'); } catch (e) { USER = null; } }
  if (USER) {
    try { const m = await USER.me(); ME.id = m.id; ME.name = m.name; ME.owner = m.isOwner; if (m.id) PROF[m.id] = { id: m.id, name: m.name, avatarUrl: m.avatarUrl, color: m.color }; } catch (e) {}
    try { const c = await USER.can('data.write'); if (c === false) { ME.canWrite = false; banner('Bạn đang ở chế độ chỉ xem. Nhờ chủ dự án mời bạn với quyền Contributor hoặc Editor để cập nhật việc.'); } } catch (e) {}
  } else if (mode === 'local') { ME.id = 'local-me'; ME.name = 'Bạn'; }
  if (mode === 'local') banner(ENV === 'claude' ? 'Chưa kết nối được kho dữ liệu chung. Thay đổi đang lưu tạm trên trình duyệt này.' : 'Bản chạy thử từ file trên máy: dữ liệu chỉ lưu trên trình duyệt này.');
  startData();
}
async function startData() {
  const loadT = setTimeout(() => { if (!S.loaded.projects) banner('Chưa tải được dữ liệu. Kiểm tra mạng, dữ liệu sẽ tự hiện khi kết nối lại.'); }, 10000);
  const into = (map, key) => rows => { map.clear(); rows.forEach(r => map.set(r.id, r)); if (key) { S.loaded[key] = true; if (S.loaded.projects && S.loaded.tasks) clearTimeout(loadT); } render(); };
  DB.watch('projects', into(S.projects, 'projects'));
  // dữ liệu thiếu trường (do người khác ghi) vẫn hiện được
  DB.watch('tasks', rows => (KIDS = null, into(S.tasks, 'tasks'))(rows.map(t => ({ ...t, status: ST[t.status] ? t.status : 'chua-lam', prio: PR[t.prio] ? t.prio : 'tb', title: t.title || '(Chưa đặt tên)' }))));
  DB.watch('team', rows => { into(S.team, 'team')(rows); if (ME.id && DB.db && ME.canWrite !== false && !S.team.has(ME.id) && !boot.registered) { boot.registered = true; ensureTeamMember(ME.id); } });
  DB.watch('resources', into(S.resources));
  if (DB.db && ME.id) { const st = await DB.getMine(); const v = st && st.lastSeen; if (v && v > NS.lastSeen) NS.lastSeen = v; }
  if (!NS.lastSeen) NS.lastSeen = Date.now() - 864e5; // lần đầu mở: chỉ coi 24 giờ gần nhất là chưa đọc
  DB.watch('activity', (rows, meta) => {
    S.activity = rows;
    const ids = new Set(rows.map(r => r.id));
    // Mốc so sánh là danh sách đầu tiên lấy từ máy chủ (không phải bản lưu tạm trên máy),
    // nên không phụ thuộc đồng hồ của từng máy. Từ đó, dòng nào mới xuất hiện thì bật thẻ.
    if (!NS.seen) { if (!meta || !meta.fromCache) NS.seen = ids; }
    else {
      const fresh = rows.filter(a => !NS.seen.has(a.id) && a.at > NS.bootAt - 15 * 60e3 && shouldPop(a));
      fresh.slice(0, 3).reverse().forEach(popActivity);
      rows.forEach(r => NS.seen.add(r.id));
    }
    render();
  }, { orderBy: ['at', 'desc'], limit: 250 });
  if (ENV === 'local') window.__pm = { DB, S, ME, analyzeText, readDocText, handleFiles, autoAssign }; // chỉ để chạy thử từ file trên máy
}
boot();
})();
</script>
